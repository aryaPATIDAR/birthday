<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Anushka's Birthday Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Outfit:wght@400;500;600;700&family=Caveat:wght@600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ============================================
   DESIGN TOKENS
   ============================================ */
:root{
  --bg0: #0a0613;
  --bg1: #150a26;
  --bg2: #1d0f34;
  --panel: rgba(255,255,255,0.045);
  --panel-border: rgba(255,255,255,0.09);
  --pink: #ff2ea6;
  --pink-soft: #ff7fc9;
  --purple: #8b3bff;
  --purple-deep: #4b1a91;
  --violet: #b866ff;
  --accent: #35f0c0;
  --text: #f5eeff;
  --text-dim: #b6a4d9;
  --text-faint: #7c6a99;
}

*{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  background: var(--bg0);
  overscroll-behavior: none;
}

body{
  color: var(--text);
  font-family: 'Outfit', sans-serif;
  overflow-x: hidden;
  min-height: 100dvh;
  position: relative;
  -webkit-user-select: none;
  user-select: none;
}

h1,h2,h3,.display{ font-family: 'Unbounded', sans-serif; }
.script{ font-family: 'Caveat', cursive; }
.mono{ font-family: 'JetBrains Mono', monospace; letter-spacing: 0.06em; }

button{ font-family: inherit; }

#root{ position: relative; z-index: 1; min-height: 100dvh; }

::selection{ background: var(--pink); color: #fff; }

/* ---------- Background FX ---------- */
#bg-fx{
  position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
  background:
    radial-gradient(ellipse 90% 60% at 50% 0%, #24123f 0%, transparent 60%),
    linear-gradient(180deg, var(--bg0) 0%, var(--bg1) 55%, var(--bg2) 100%);
}
.glow-orb{
  position: absolute; border-radius: 50%; filter: blur(80px);
  animation: orbFloat ease-in-out infinite;
  will-change: transform;
  -webkit-transform: translateZ(0); transform: translateZ(0);
}
.glow-orb.o1{ width: 380px; height: 380px; top: -8%; left: -10%; background: radial-gradient(circle, var(--pink) 0%, transparent 70%); opacity: 0.35; animation-duration: 17s; }
.glow-orb.o2{ width: 460px; height: 460px; top: 30%; right: -14%; background: radial-gradient(circle, var(--purple) 0%, transparent 70%); opacity: 0.38; animation-duration: 21s; animation-delay: -5s; }
.glow-orb.o3{ width: 340px; height: 340px; bottom: 0%; left: 8%; background: radial-gradient(circle, var(--violet) 0%, transparent 70%); opacity: 0.3; animation-duration: 19s; animation-delay: -9s; }
@keyframes orbFloat{
  0%,100%{ transform: translate(0,0) scale(1); }
  50%{ transform: translate(26px,-20px) scale(1.07); }
}
.spark-field{ position: absolute; inset: 0; }
.spark{
  position: absolute; border-radius: 50%; background: #fff;
  opacity: 0.5; animation: sparkTwinkle 3s ease-in-out infinite;
}
@keyframes sparkTwinkle{ 0%,100%{ opacity: 0.15; } 50%{ opacity: 0.85; } }

/* ---------- Layout shells ---------- */
.stage{
  min-height: 100dvh;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 90px 20px 40px;
  position: relative;
}
.stage-inner{ width: 100%; max-width: 480px; display:flex; flex-direction:column; align-items:center; }

.eyebrow{
  font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--pink-soft);
  margin-bottom: 14px; text-align: center;
}
.headline{
  font-size: clamp(28px, 8vw, 42px); font-weight: 700; text-align:center; line-height: 1.15;
  background: linear-gradient(90deg, #fff 0%, var(--pink-soft) 60%, var(--violet) 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  text-shadow: 0 0 40px rgba(255,46,166,0.25);
}
.subtext{
  font-family: 'Caveat', cursive; font-size: clamp(19px, 5vw, 24px); color: var(--text-dim);
  text-align:center; margin-top: 10px;
}

/* ---------- Buttons ---------- */
.neon-btn{
  margin-top: 36px; padding: 15px 34px; border-radius: 100px; border: 1px solid rgba(255,127,201,0.5);
  background: linear-gradient(135deg, rgba(255,46,166,0.18), rgba(139,59,255,0.18));
  color: #fff; font-size: 15px; font-weight: 600; letter-spacing: 0.02em;
  cursor: pointer; position: relative; transition: transform 0.25s ease, box-shadow 0.25s ease;
  box-shadow: 0 0 0 0 rgba(255,46,166,0.4);
  animation: btnPulse 2.6s ease-in-out infinite;
}
.neon-btn:active{ transform: scale(0.96); }
.neon-btn:disabled{ opacity: 0.4; cursor: not-allowed; animation: none; }
@keyframes btnPulse{
  0%,100%{ box-shadow: 0 0 0 0 rgba(255,46,166,0.35), 0 0 20px rgba(139,59,255,0.25); }
  50%{ box-shadow: 0 0 0 9px rgba(255,46,166,0), 0 0 30px rgba(139,59,255,0.4); }
}
.ghost-btn{
  margin-top: 14px; padding: 9px 18px; border-radius: 100px; border: none;
  background: transparent; color: var(--text-faint); font-size: 13px; cursor: pointer;
  text-decoration: underline; text-underline-offset: 3px;
}

/* ---------- Progress tracker (level path) ---------- */
.tracker{
  position: fixed; top: 0; left: 0; right: 0; z-index: 20;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 16px 14px; backdrop-filter: blur(10px);
  background: linear-gradient(180deg, rgba(10,6,19,0.75), transparent);
}
.track-node{
  width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,0.15);
  transition: all 0.4s ease; position: relative;
}
.track-node.done{ background: var(--accent); box-shadow: 0 0 10px var(--accent); }
.track-node.active{ background: var(--pink); box-shadow: 0 0 12px var(--pink); width: 22px; border-radius: 6px; }
.track-line{ width: 18px; height: 2px; background: rgba(255,255,255,0.12); border-radius: 2px; }
.track-line.done{ background: var(--accent); }

/* ---------- Sound toggle ---------- */
.sound-btn{
  position: fixed; top: 14px; right: 14px; z-index: 30;
  width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--panel-border);
  background: rgba(255,255,255,0.06); color: var(--text); font-size: 16px;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  backdrop-filter: blur(6px);
}

/* ---------- Confetti canvas ---------- */
.confetti-canvas{ position: fixed; inset:0; z-index: 60; pointer-events:none; }

@media (prefers-reduced-motion: reduce){
  *{ animation: none !important; transition: none !important; }
}
</style>
</head>

  <div class="glow-orb o1"></div>

<script>
/* Visible error fallback — if React fails to mount for any reason,
   show the actual error on-screen instead of a silent blank page. */
window.__lastError = null;
window.addEventListener('error', function (e) {
  window.__lastError = (e.error && e.error.message) || e.message || 'Unknown error';
});
window.addEventListener('DOMContentLoaded', function () {
  setTimeout(function () {
    const root = document.getElementById('root');
    if (root && root.innerHTML.trim() === '') {
      root.innerHTML =
        '<div style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;color:#f5eeff;font-family:sans-serif;">' +
        '<div style="font-size:40px;margin-bottom:12px;">⚠️</div>' +
        '<div style="font-size:16px;font-weight:600;margin-bottom:8px;">Page load mein dikkat aayi</div>' +
        '<div style="font-size:13px;color:#b6a4d9;max-width:320px;">' + (window.__lastError || 'Scripts load nahi ho paaye — internet check karke page reload karo.') + '</div>' +
        '<button onclick="location.reload()" style="margin-top:20px;padding:10px 22px;border-radius:100px;border:1px solid rgba(255,127,201,0.5);background:rgba(255,46,166,0.15);color:#fff;font-size:14px;">Reload</button>' +
        '</div>';
    }
  }, 4000);
});
</script>

<script>
/* Ambient starfield (plain JS, runs once, outside React) */
(function makeSparks(){
  const field = document.getElementById('spark-field');
  for(let i=0;i<50;i++){
    const s = document.createElement('div');
    s.className = 'spark';
    const size = Math.random()*2 + 1;
    s.style.width = size+'px';
    s.style.height = size+'px';
    s.style.left = Math.random()*100+'%';
    s.style.top = Math.random()*100+'%';
    s.style.animationDelay = (Math.random()*3)+'s';
    field.appendChild(s);
  }
})();
</script>

<script type="text/babel" data-presets="react">
const { useState, useRef, useEffect, useCallback, useContext, createContext } = React;

/* ============================================
   CONFIG — edit photos, name, letter text here
   ============================================ */
const CONFIG = {
  herName: "Anushka",
  puzzleImage: "photo1.jpeg",
  scratchImage: "photo2.jpeg",
  gallery: [
    { url: "photo1.jpeg", caption: "Us din ki masti ✨" },
    { url: "photo2.jpeg", caption: "Wo pyaari si smile 💕" },
    { url: "photo3.jpeg", caption: "Ye look toh best hai 😍" },
    { url: "photo4.jpeg", caption: "Hum dono ki jodi 🥹" }
  ],
  letter: [
    "Happy Birthday to the most beautiful headache of my life. ❤️",
    "Happy birthday to the person who makes ordinary days feel like something worth remembering. I hope this year brings you everything you quietly wish for, and I hope I get to watch it happen right beside you.",
    "You're my favorite gossip partner, the first person I want to share every random story with, and somehow the best adviser whenever I'm confused. No matter how much we tease each other, I know I can always count on you.",
    "Keep smiling, keep annoying me, and most importantly, never change — because that's exactly what makes you so special.",
    "Happy Birthday. 🤍"
  ]
};

const STAGES = ["welcome", "puzzle", "scratch", "gallery", "letter", "gift"];
const STAGE_LABELS = { puzzle: "Puzzle", scratch: "Scratch", gallery: "Memories", letter: "Letter", gift: "Gift" };

/* ============================================
   CONFETTI (real-time bursts, shared via context)
   ============================================ */
const ConfettiContext = createContext(() => {});
function useConfetti(){ return useContext(ConfettiContext); }

function ConfettiProvider({ children }) {
  const canvasRef = useRef(null);
  const particlesRef = useRef([]);
  const rafRef = useRef(null);

  useEffect(() => {
    const canvas = canvasRef.current;
    const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
    resize();
    window.addEventListener('resize', resize);
    return () => window.removeEventListener('resize', resize);
  }, []);

  const loop = useCallback(() => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const gravity = 0.16;
    particlesRef.current = particlesRef.current.filter(p => p.y < canvas.height + 40 && p.life > 0);
    particlesRef.current.forEach(p => {
      p.vy += gravity;
      p.x += p.vx; p.y += p.vy; p.rot += p.vrot; p.life -= 1;
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life / 40));
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * 0.6);
      ctx.restore();
    });
    if (particlesRef.current.length > 0) {
      rafRef.current = requestAnimationFrame(loop);
    } else {
      rafRef.current = null;
    }
  }, []);

  const burst = useCallback((xRatio = 0.5, yRatio = 0.4, count = 90) => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const colors = ['#ff2ea6', '#8b3bff', '#ff7fc9', '#35f0c0', '#b866ff', '#fff'];
    const originX = canvas.width * xRatio;
    const originY = canvas.height * yRatio;
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 7 + 3;
      particlesRef.current.push({
        x: originX, y: originY,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 4,
        r: Math.random() * 7 + 5,
        rot: Math.random() * 360,
        vrot: Math.random() * 10 - 5,
        color: colors[Math.floor(Math.random() * colors.length)],
        life: 70 + Math.random() * 30
      });
    }
    if (!rafRef.current) rafRef.current = requestAnimationFrame(loop);
  }, [loop]);

  return (
    <ConfettiContext.Provider value={burst}>
      <canvas ref={canvasRef} className="confetti-canvas" />
      {children}
    </ConfettiContext.Provider>
  );
}

/* ============================================
   MUSIC (synthesized, starts instantly on gesture — zero network lag)
   ============================================ */
function useBirthdayMusic() {
  const ctxRef = useRef(null);
  const stoppedRef = useRef(true);
  const timeoutRef = useRef(null);
  const [muted, setMuted] = useState(false);
  const mutedRef = useRef(false);

  const NOTE = { G4: 392.00, A4: 440.00, B4: 493.88, C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99 };
  const MELODY = [
    [NOTE.G4, 0.3], [NOTE.G4, 0.15], [NOTE.A4, 0.45], [NOTE.G4, 0.45], [NOTE.C5, 0.45], [NOTE.B4, 0.9],
    [NOTE.G4, 0.3], [NOTE.G4, 0.15], [NOTE.A4, 0.45], [NOTE.G4, 0.45], [NOTE.D5, 0.45], [NOTE.C5, 0.9],
    [NOTE.G4, 0.3], [NOTE.G4, 0.15], [NOTE.G5, 0.45], [NOTE.E5, 0.45], [NOTE.C5, 0.45], [NOTE.B4, 0.45], [NOTE.A4, 0.9],
    [NOTE.F5, 0.3], [NOTE.F5, 0.15], [NOTE.E5, 0.45], [NOTE.C5, 0.45], [NOTE.D5, 0.45], [NOTE.C5, 0.9]
  ];

  const playNote = (ctx, freq, startTime, duration, vol = 0.14) => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(vol, startTime + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start(startTime);
    osc.stop(startTime + duration + 0.05);
  };

  const scheduleLoop = () => {
    const ctx = ctxRef.current;
    if (!ctx || stoppedRef.current) return;
    const start = ctx.currentTime + 0.08;
    let t = start;
    if (!mutedRef.current) {
      MELODY.forEach(([freq, dur]) => {
        playNote(ctx, freq, t, dur * 0.9, 0.13);
        playNote(ctx, freq / 2, t, dur * 0.9, 0.05);
        t += dur;
      });
    } else {
      MELODY.forEach(([, dur]) => { t += dur; });
    }
    const total = MELODY.reduce((s, n) => s + n[1], 0);
    timeoutRef.current = setTimeout(scheduleLoop, total * 1000);
  };

  const start = () => {
    if (ctxRef.current) return;
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      ctxRef.current = ctx;
      stoppedRef.current = false;
      scheduleLoop();
    } catch (e) {}
  };

  const toggleMute = () => {
    mutedRef.current = !mutedRef.current;
    setMuted(mutedRef.current);
    if (ctxRef.current && ctxRef.current.state === 'suspended') ctxRef.current.resume();
  };

  useEffect(() => () => {
    stoppedRef.current = true;
    if (timeoutRef.current) clearTimeout(timeoutRef.current);
    if (ctxRef.current) ctxRef.current.close();
  }, []);

  return { start, muted, toggleMute };
}

/* ============================================
   PROGRESS TRACKER
   ============================================ */
function Tracker({ stage }) {
  if (stage === 'welcome') return null;
  const flow = ['puzzle', 'scratch', 'gallery', 'letter', 'gift'];
  const idx = flow.indexOf(stage);
  return (
    <div className="tracker">
      {flow.map((s, i) => (
        <React.Fragment key={s}>
          <div className={"track-node" + (i < idx ? " done" : i === idx ? " active" : "")} title={STAGE_LABELS[s]} />
          {i < flow.length - 1 && <div className={"track-line" + (i < idx ? " done" : "")} />}
        </React.Fragment>
      ))}
    </div>
  );
}

/* ============================================
   WELCOME SCREEN
   ============================================ */
function Welcome({ onStart }) {
  return (
    <div className="stage">
      <div className="stage-inner">
        <div className="eyebrow mono">a little adventure for you</div>
        <h1 className="headline">Ready, {CONFIG.herName}?</h1>
        <div className="subtext">3 tiny challenges stand between you and your surprise 🎁</div>
        <button className="neon-btn" onClick={onStart}>Begin the adventure →</button>
      </div>
    </div>
  );
}

/* ============================================
   STAGE 1 — JIGSAW PUZZLE
   ============================================ */
function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function PuzzleGame({ onSolved }) {
  const GRID = 3;
  const total = GRID * GRID;
  const gridRef = useRef(null);
  const confetti = useConfetti();

  const [boardSize, setBoardSize] = useState(300);
  const [placed, setPlaced] = useState({});
  const [tray, setTray] = useState(() => shuffleArray([...Array(total).keys()]));
  const [dragId, setDragId] = useState(null);
  const [dragPos, setDragPos] = useState({ x: 0, y: 0 });
  const [hoverSlot, setHoverSlot] = useState(null);
  const [solved, setSolved] = useState(false);
  const trayRotations = useRef([...Array(total)].map(() => Math.random() * 16 - 8));

  useEffect(() => {
    const update = () => setBoardSize(Math.min(320, window.innerWidth * 0.8, window.innerHeight * 0.42));
    update();
    window.addEventListener('resize', update);
    return () => window.removeEventListener('resize', update);
  }, []);

  const pieceSize = boardSize / GRID;

  const bgPosFor = (id) => {
    const row = Math.floor(id / GRID);
    const col = id % GRID;
    const pct = (v) => (v / (GRID - 1)) * 100;
    return `${pct(col)}% ${pct(row)}%`;
  };

  const handlePointerDown = (id) => (e) => {
    e.preventDefault();
    const point = e.touches ? e.touches[0] : e;
    setDragId(id);
    setDragPos({ x: point.clientX, y: point.clientY });
  };

  useEffect(() => {
    if (dragId === null) return;
    const move = (e) => {
      const point = e.touches ? e.touches[0] : e;
      setDragPos({ x: point.clientX, y: point.clientY });
      if (gridRef.current) {
        const rect = gridRef.current.getBoundingClientRect();
        const x = point.clientX - rect.left;
        const y = point.clientY - rect.top;
        if (x >= 0 && y >= 0 && x < rect.width && y < rect.height) {
          const col = Math.min(GRID - 1, Math.floor(x / pieceSize));
          const row = Math.min(GRID - 1, Math.floor(y / pieceSize));
          setHoverSlot(row * GRID + col);
        } else {
          setHoverSlot(null);
        }
      }
    };
    const up = (e) => {
      const point = e.changedTouches ? e.changedTouches[0] : e;
      let dropped = false;
      if (gridRef.current) {
        const rect = gridRef.current.getBoundingClientRect();
        const x = point.clientX - rect.left;
        const y = point.clientY - rect.top;
        if (x >= 0 && y >= 0 && x < rect.width && y < rect.height) {
          const col = Math.min(GRID - 1, Math.floor(x / pieceSize));
          const row = Math.min(GRID - 1, Math.floor(y / pieceSize));
          const slot = row * GRID + col;
          if (slot === dragId && !placed[slot]) {
            setPlaced(prev => {
              const next = { ...prev, [slot]: true };
              const doneCount = Object.keys(next).length;
              if (doneCount === total) {
                setSolved(true);
                confetti(0.5, 0.35, 140);
                setTimeout(() => onSolved(), 1300);
              } else {
                confetti((rect.left + col * pieceSize + pieceSize / 2) / window.innerWidth,
                         (rect.top + row * pieceSize + pieceSize / 2) / window.innerHeight, 26);
              }
              return next;
            });
            setTray(prev => prev.filter(t => t !== dragId));
            dropped = true;
          }
        }
      }
      setDragId(null);
      setHoverSlot(null);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('touchmove', move, { passive: false });
    window.addEventListener('mouseup', up);
    window.addEventListener('touchend', up);
    return () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('touchmove', move);
      window.removeEventListener('mouseup', up);
      window.removeEventListener('touchend', up);
    };
  }, [dragId, placed, pieceSize, onSolved, confetti]);

  return (
    <div className="stage">
      <div className="stage-inner">
        <div className="eyebrow mono">level 1 / puzzle</div>
        <h2 className="headline" style={{ fontSize: 'clamp(22px,6vw,30px)' }}>Piece it together</h2>
        <div className="subtext" style={{ marginBottom: 22 }}>Drag each piece onto its matching spot</div>

        <div
          ref={gridRef}
          style={{
            position: 'relative', width: boardSize, height: boardSize,
            display: 'grid', gridTemplateColumns: `repeat(${GRID}, 1fr)`,
            gridTemplateRows: `repeat(${GRID}, 1fr)`,
            borderRadius: 16, overflow: 'hidden',
            boxShadow: solved ? '0 0 50px rgba(255,46,166,0.55)' : '0 0 30px rgba(139,59,255,0.2)',
            border: '1px solid var(--panel-border)', transition: 'box-shadow 0.6s ease'
          }}
        >
          {[...Array(total).keys()].map(slot => (
            <div key={slot} style={{
              position: 'relative',
              background: placed[slot] ? `url(${CONFIG.puzzleImage})` : 'rgba(255,255,255,0.03)',
              backgroundSize: `${GRID * 100}% ${GRID * 100}%`,
              backgroundPosition: bgPosFor(slot),
              outline: hoverSlot === slot && dragId !== null && !placed[slot] ? '2px solid var(--accent)' : '1px dashed rgba(255,255,255,0.12)',
              outlineOffset: '-2px'
            }} />
          ))}
        </div>

        {!solved && (
          <div style={{
            display: 'flex', flexWrap: 'wrap', gap: 10, justifyContent: 'center',
            marginTop: 26, maxWidth: boardSize + 40
          }}>
            {tray.map(id => (
              <div
                key={id}
                onMouseDown={handlePointerDown(id)}
                onTouchStart={handlePointerDown(id)}
                style={{
                  width: pieceSize * 0.82, height: pieceSize * 0.82,
                  backgroundImage: `url(${CONFIG.puzzleImage})`,
                  backgroundSize: `${GRID * 100}% ${GRID * 100}%`,
                  backgroundPosition: bgPosFor(id),
                  borderRadius: 8, cursor: 'grab',
                  boxShadow: '0 6px 16px rgba(0,0,0,0.4)',
                  border: '1px solid rgba(255,255,255,0.15)',
                  transform: dragId === id ? 'scale(0)' : `rotate(${trayRotations.current[id]}deg)`,
                  transition: 'transform 0.2s ease',
                  touchAction: 'none'
                }}
              />
            ))}
          </div>
        )}

        {solved && <div className="subtext" style={{ marginTop: 20, color: 'var(--accent)' }}>✨ Solved! Unlocking next level...</div>}

        {dragId !== null && (
          <div style={{
            position: 'fixed', left: dragPos.x - pieceSize * 0.41, top: dragPos.y - pieceSize * 0.41,
            width: pieceSize * 0.82, height: pieceSize * 0.82,
            backgroundImage: `url(${CONFIG.puzzleImage})`,
            backgroundSize: `${GRID * 100}% ${GRID * 100}%`,
            backgroundPosition: bgPosFor(dragId),
            borderRadius: 8, pointerEvents: 'none', zIndex: 50,
            boxShadow: '0 10px 30px rgba(0,0,0,0.5)',
            border: '2px solid var(--pink)'
          }} />
        )}
      </div>
    </div>
  );
}

/* ============================================
   STAGE 2 — SCRATCH CARD
   ============================================ */
function ScratchCard({ onDone }) {
  const wrapRef = useRef(null);
  const canvasRef = useRef(null);
  const confetti = useConfetti();
  const [percent, setPercent] = useState(0);
  const [revealed, setRevealed] = useState(false);
  const scratchingRef = useRef(false);
  const checkCounterRef = useRef(0);

  useEffect(() => {
    const canvas = canvasRef.current;
    const wrap = wrapRef.current;
    const ctx = canvas.getContext('2d');
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    const setup = () => {
      const rect = wrap.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      canvas.style.width = rect.width + 'px';
      canvas.style.height = rect.height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const grad = ctx.createLinearGradient(0, 0, rect.width, rect.height);
      grad.addColorStop(0, '#7a3ad1');
      grad.addColorStop(0.5, '#c73fa8');
      grad.addColorStop(1, '#7a3ad1');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, rect.width, rect.height);
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.font = '600 15px Outfit, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('✨ scratch to reveal ✨', rect.width / 2, rect.height / 2);
    };
    setup();
    window.addEventListener('resize', setup);
    return () => window.removeEventListener('resize', setup);
  }, []);

  const scratchAt = useCallback((clientX, clientY) => {
    const canvas = canvasRef.current;
    const rect = canvas.getBoundingClientRect();
    const x = clientX - rect.left;
    const y = clientY - rect.top;
    const ctx = canvas.getContext('2d');
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(x, y, 32, 0, Math.PI * 2);
    ctx.fill();

    checkCounterRef.current += 1;
    if (checkCounterRef.current % 6 === 0) {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      let cleared = 0;
      const step = 40;
      let total = 0;
      for (let i = 3; i < data.length; i += step) {
        total++;
        if (data[i] === 0) cleared++;
      }
      const pct = Math.round((cleared / total) * 100);
      setPercent(pct);
      if (pct > 55 && !revealed) {
        setRevealed(true);
        confetti(0.5, 0.4, 130);
      }
    }
  }, [revealed, confetti]);

  const handleDown = (e) => {
    scratchingRef.current = true;
    const p = e.touches ? e.touches[0] : e;
    scratchAt(p.clientX, p.clientY);
  };
  const handleMove = (e) => {
    if (!scratchingRef.current) return;
    e.preventDefault();
    const p = e.touches ? e.touches[0] : e;
    scratchAt(p.clientX, p.clientY);
  };
  const handleUp = () => { scratchingRef.current = false; };

  return (
    <div className="stage">
      <div className="stage-inner">
        <div className="eyebrow mono">level 2 / scratch card</div>
        <h2 className="headline" style={{ fontSize: 'clamp(22px,6vw,30px)' }}>Scratch the surprise</h2>
        <div className="subtext" style={{ marginBottom: 22 }}>Use your finger to reveal what's underneath</div>

        <div ref={wrapRef} style={{
          position: 'relative', width: '100%', maxWidth: 300, aspectRatio: '4/5',
          borderRadius: 18, overflow: 'hidden', border: '1px solid var(--panel-border)',
          boxShadow: revealed ? '0 0 50px rgba(255,46,166,0.5)' : '0 0 24px rgba(139,59,255,0.2)',
          transition: 'box-shadow 0.6s ease'
        }}>
          <img src={CONFIG.scratchImage} alt="surprise" style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }} />
          <canvas
            ref={canvasRef}
            onMouseDown={handleDown} onMouseMove={handleMove} onMouseUp={handleUp} onMouseLeave={handleUp}
            onTouchStart={handleDown} onTouchMove={handleMove} onTouchEnd={handleUp}
            style={{
              position: 'absolute', inset: 0, touchAction: 'none', cursor: 'pointer',
              opacity: revealed ? 0 : 1, transition: 'opacity 0.7s ease'
            }}
          />
        </div>

        <div className="mono" style={{ marginTop: 16, fontSize: 12, color: 'var(--text-faint)' }}>{Math.min(percent, 100)}% scratched</div>

        {revealed && (
          <button className="neon-btn" onClick={onDone}>Continue →</button>
        )}
      </div>
    </div>
  );
}

/* ============================================
   STAGE 3 — SWIPEABLE MEMORY GALLERY
   ============================================ */
function GalleryStack({ onDone }) {
  const photos = CONFIG.gallery;
  const [index, setIndex] = useState(0);
  const [dragX, setDragX] = useState(0);
  const [exiting, setExiting] = useState(null);
  const draggingRef = useRef(false);
  const startXRef = useRef(0);
  const confetti = useConfetti();

  const done = index >= photos.length;

  useEffect(() => {
    if (done) confetti(0.5, 0.4, 100);
  }, [done, confetti]);

  const handleDown = (e) => {
    if (done) return;
    draggingRef.current = true;
    const p = e.touches ? e.touches[0] : e;
    startXRef.current = p.clientX;
  };
  const handleMove = (e) => {
    if (!draggingRef.current) return;
    const p = e.touches ? e.touches[0] : e;
    setDragX(p.clientX - startXRef.current);
  };
  const handleUp = () => {
    if (!draggingRef.current) return;
    draggingRef.current = false;
    if (Math.abs(dragX) > 90) {
      const dir = dragX > 0 ? 1 : -1;
      setExiting(dir);
      setTimeout(() => {
        setIndex(i => i + 1);
        setExiting(null);
        setDragX(0);
      }, 260);
    } else {
      setDragX(0);
    }
  };

  const swipeManual = (dir) => {
    if (done) return;
    setExiting(dir);
    setTimeout(() => {
      setIndex(i => i + 1);
      setExiting(null);
      setDragX(0);
    }, 260);
  };

  return (
    <div className="stage">
      <div className="stage-inner">
        <div className="eyebrow mono">level 3 / memories</div>
        <h2 className="headline" style={{ fontSize: 'clamp(22px,6vw,30px)' }}>Swipe through us</h2>
        <div className="subtext" style={{ marginBottom: 22 }}>{done ? 'That\'s all of them 🥹' : `${index + 1} / ${photos.length}`}</div>

        <div style={{ position: 'relative', width: 260, height: 340 }}>
          {!done && photos.map((photo, i) => {
            if (i < index) return null;
            const depth = i - index;
            if (depth > 2) return null;
            const isTop = depth === 0;
            const translate = isTop ? dragX : 0;
            const rotate = isTop ? dragX / 18 : 0;
            let transform = `translateX(${translate}px) translateY(${depth * 10}px) rotate(${rotate}deg) scale(${1 - depth * 0.05})`;
            let opacity = 1;
            let transition = draggingRef.current ? 'none' : 'transform 0.35s cubic-bezier(.2,.8,.3,1)';
            if (isTop && exiting) {
              transform = `translateX(${exiting * 500}px) rotate(${exiting * 30}deg)`;
              opacity = 0;
              transition = 'transform 0.26s ease, opacity 0.26s ease';
            }
            return (
              <div
                key={photo.url + i}
                onMouseDown={isTop ? handleDown : undefined}
                onMouseMove={isTop ? handleMove : undefined}
                onMouseUp={isTop ? handleUp : undefined}
                onMouseLeave={isTop ? handleUp : undefined}
                onTouchStart={isTop ? handleDown : undefined}
                onTouchMove={isTop ? handleMove : undefined}
                onTouchEnd={isTop ? handleUp : undefined}
                style={{
                  position: 'absolute', inset: 0, borderRadius: 20, overflow: 'hidden',
                  background: 'var(--panel)', border: '1px solid var(--panel-border)',
                  boxShadow: '0 20px 40px rgba(0,0,0,0.45)',
                  transform, opacity, transition,
                  zIndex: 10 - depth, cursor: isTop ? 'grab' : 'default', touchAction: 'none'
                }}
              >
                <img src={photo.url} alt={photo.caption} style={{ width: '100%', height: '80%', objectFit: 'cover', display: 'block' }} draggable={false} />
                <div className="script" style={{ padding: '10px 14px', fontSize: 19, textAlign: 'center', color: 'var(--text)' }}>{photo.caption}</div>
              </div>
            );
          })}
          {done && (
            <div style={{
              position: 'absolute', inset: 0, borderRadius: 20, display: 'flex',
              alignItems: 'center', justifyContent: 'center', textAlign: 'center',
              border: '1px dashed var(--panel-border)', color: 'var(--text-dim)', fontSize: 15, padding: 20
            }}>
              All memories unlocked ✨
            </div>
          )}
        </div>

        {!done ? (
          <button className="ghost-btn" onClick={() => swipeManual(1)}>swipe or tap next →</button>
        ) : (
          <button className="neon-btn" onClick={onDone}>Continue →</button>
        )}
      </div>
    </div>
  );
}

/* ============================================
   STAGE 4 — LETTER (typewriter)
   ============================================ */
function LetterReveal({ onDone }) {
  const fullText = CONFIG.letter.join('\n\n');
  const [visible, setVisible] = useState(0);
  const [finished, setFinished] = useState(false);

  useEffect(() => {
    if (visible >= fullText.length) { setFinished(true); return; }
    const t = setTimeout(() => setVisible(v => Math.min(fullText.length, v + 2)), 16);
    return () => clearTimeout(t);
  }, [visible, fullText.length]);

  const skip = () => { setVisible(fullText.length); setFinished(true); };

  return (
    <div className="stage">
      <div className="stage-inner">
        <div className="eyebrow mono">level 4 / letter</div>
        <h2 className="headline" style={{ fontSize: 'clamp(22px,6vw,30px)' }}>From my heart 💌</h2>

        <div style={{
          marginTop: 22, background: 'var(--panel)', border: '1px solid var(--panel-border)',
          borderRadius: 18, padding: '26px 22px', minHeight: 260, width: '100%'
        }}>
          <p className="script" style={{ fontSize: 21, lineHeight: 1.6, whiteSpace: 'pre-wrap', color: 'var(--text)' }}>
            {fullText.slice(0, visible)}
            {!finished && <span style={{ opacity: 0.6 }}>▌</span>}
          </p>
        </div>

        {!finished ? (
          <button className="ghost-btn" onClick={skip}>skip typing</button>
        ) : (
          <button className="neon-btn" onClick={onDone}>One last thing →</button>
        )}
      </div>
    </div>
  );
}

/* ============================================
   STAGE 5 — GIFT FINALE
   ============================================ */
function GiftFinale({ onRestart }) {
  const [opened, setOpened] = useState(false);
  const confetti = useConfetti();

  const open = () => {
    if (opened) return;
    setOpened(true);
    confetti(0.5, 0.35, 160);
    setTimeout(() => confetti(0.25, 0.5, 60), 250);
    setTimeout(() => confetti(0.75, 0.5, 60), 450);
  };

  return (
    <div className="stage">
      <div className="stage-inner">
        <div className="eyebrow mono">level 5 / final gift</div>
        <h2 className="headline" style={{ fontSize: 'clamp(22px,6vw,30px)' }}>{opened ? `Happy Birthday, ${CONFIG.herName}!` : 'One last thing'}</h2>

        <div
          onClick={open}
          style={{
            marginTop: 30, fontSize: 90, cursor: 'pointer', userSelect: 'none',
            filter: 'drop-shadow(0 10px 30px rgba(255,46,166,0.45))',
            transform: opened ? 'scale(1.05)' : 'scale(1)',
            transition: 'transform 0.4s ease'
          }}
        >
          {opened ? '💝' : '🎁'}
        </div>

        {opened && (
          <div className="script" style={{ fontSize: 22, color: 'var(--text-dim)', textAlign: 'center', marginTop: 18, maxWidth: 340 }}>
            Best friends like you don't come around twice — so glad I got the good one. Here's to you. 🤍
          </div>
        )}

        {opened && <button className="ghost-btn" onClick={onRestart}>replay the adventure</button>}
      </div>
    </div>
  );
}

/* ============================================
   ROOT APP
   ============================================ */
function App() {
  const [stage, setStage] = useState('welcome');
  const music = useBirthdayMusic();

  const goto = (s) => {
    setStage(s);
    window.scrollTo(0, 0);
  };

  const handleStart = () => { music.start(); goto('puzzle'); };

  return (
    <ConfettiProvider>
      <Tracker stage={stage} />
      <button className="sound-btn" onClick={music.toggleMute} aria-label="toggle sound">
        {music.muted ? '🔇' : '🔊'}
      </button>

      {stage === 'welcome' && <Welcome onStart={handleStart} />}
      {stage === 'puzzle' && <PuzzleGame onSolved={() => goto('scratch')} />}
      {stage === 'scratch' && <ScratchCard onDone={() => goto('gallery')} />}
      {stage === 'gallery' && <GalleryStack onDone={() => goto('letter')} />}
      {stage === 'letter' && <LetterReveal onDone={() => goto('gift')} />}
      {stage === 'gift' && <GiftFinale onRestart={() => goto('welcome')} />}
    </ConfettiProvider>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
